name: Keep-alive (anti-veille HF Spaces)

# Les Spaces Hugging Face gratuits se mettent en veille apres inactivite.
# Ce cron externe frappe les endpoints de sante pour garder les conteneurs
# eveilles (et, cote backend, garde la connexion DB chaude via /actuator/health).
on:
  schedule:
    - cron: "*/10 * * * *" # toutes les 10 minutes (min. GitHub = 5 min)
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --max-time 90 \
            https://ilyas8888-smartlife-backend.hf.space/actuator/health \
            && echo "[keep-alive] backend OK" \
            || echo "[keep-alive] backend injoignable (cold start en cours ?)"

      - name: Ping ai-service
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 15 --max-time 90 \
            https://ilyas8888-smartlife-ai-service.hf.space/health \
            && echo "[keep-alive] ai-service OK" \
            || echo "[keep-alive] ai-service injoignable (cold start en cours ?)"
